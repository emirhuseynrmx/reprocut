[package]
name = "reprocut"
description = "Deterministic failing-project minimizer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["debugging", "delta-debugging", "reproducer", "testing", "cli"]
categories = ["command-line-utilities", "development-tools::debugging"]

[[bin]]
name = "reprocut"
path = "src/main.rs"

[dependencies]
clap.workspace = true
reprocut-adapters = { path = "../reprocut-adapters", version = "0.1.0" }
reprocut-core = { path = "../reprocut-core", version = "0.1.0" }
reprocut-engine = { path = "../reprocut-engine", version = "0.1.0" }
reprocut-oci = { path = "../reprocut-oci", version = "0.1.0" }
reprocut-report = { path = "../reprocut-report", version = "0.1.0" }
reprocut-workspace = { path = "../reprocut-workspace", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
