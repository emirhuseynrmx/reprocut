[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "reprocut"
version = "0.1.0"
description = "Shrink failing projects without changing the failure"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Emir Hüseyin İnci" }]
keywords = ["debugging", "delta-debugging", "reproducer", "testing", "rust"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/emirhuseynrmx/reprocut"
Repository = "https://github.com/emirhuseynrmx/reprocut"
Issues = "https://github.com/emirhuseynrmx/reprocut/issues"
Changelog = "https://github.com/emirhuseynrmx/reprocut/blob/main/CHANGELOG.md"

[project.scripts]
reprocut-py = "reprocut.cli:main"

[project.optional-dependencies]
test = ["Pillow==12.2.0", "pytest==8.4.2", "ruff==0.16.2"]
benchmark = ["psutil==7.2.2"]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/reprocut-python/Cargo.toml"
python-source = "python"
module-name = "reprocut._native"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["python/tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["demo/result"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "RUF", "SIM", "UP"]
