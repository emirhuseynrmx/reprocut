name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Reject handwritten unsafe at the Python boundary
        run: |
          if grep -Rnw crates/reprocut-python/src -e unsafe; then
            exit 1
          fi
      - name: Lint every target and feature
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust contracts
        run: cargo test --workspace --all-targets
        env:
          TEST_PYTHON: python
      - name: Compile benchmarks
        run: cargo bench -p reprocut-core --bench reducer --no-run
      - name: Reject documentation warnings
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run source-checkout Python contracts
        run: |
          python -m pip install Pillow==12.2.0 pytest==8.4.2 ruff==0.16.2
          ruff format --check python scripts demo/source
          ruff check python scripts demo/source
          PYTHONPATH=python python -m pytest python/tests -q

  loom:
    name: Loom interleaving model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Explore ordered frontier interleavings
        run: cargo test -p reprocut-core --features loom --test loom_winner
        env:
          RUSTFLAGS: --cfg loom

  miri:
    name: Miri undefined-behavior model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Run pure core contracts under Miri
        run: >-
          cargo +nightly miri test -p reprocut-core
          --lib
          --test model_contract
          --test oracle_contract
          --test reducer_contract

  sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Test core and process runner with ASan
        run: >-
          cargo +nightly test
          -p reprocut-core
          -p reprocut-runner
          -p reprocut-syntax
          --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1

  supply-chain:
    name: Advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  python-wheel:
    name: Native wheel / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build and install native wheel
        run: |
          python -m pip install maturin==1.14.1 Pillow==12.2.0 pytest==8.4.2
          maturin build --release
          python -m pip install --force-reinstall target/wheels/reprocut-*.whl
      - name: Require native backend in Python contracts
        run: python -m pytest python/tests -q
        env:
          REPROCUT_REQUIRE_NATIVE: "1"

  cli-platforms:
    name: CLI smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Exercise the real CLI fixture
        run: cargo test -p reprocut-cli --test cli_contract
        env:
          TEST_PYTHON: python
