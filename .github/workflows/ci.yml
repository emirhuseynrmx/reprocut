name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, test, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          rustup default 1.85.0
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Reject handwritten unsafe at the Python boundary
        run: |
          if grep -Rnw crates/reprocut-python/src -e unsafe; then
            exit 1
          fi
      - name: Lint every target and feature
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run Rust contracts
        run: cargo test --locked --workspace --all-targets
        env:
          TEST_PYTHON: python
      - name: Verify checked-in canonical demo artifact
        run: cargo run --locked -p reprocut -- verify demo/result --json
      - name: Compile benchmarks
        run: cargo bench --locked -p reprocut-core --bench reducer --no-run
      - name: Reject documentation warnings
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Run source-checkout Python contracts
        run: |
          python -m pip install Pillow==12.3.0 pytest==8.4.2 ruff==0.16.2
          ruff format --check python scripts demo/source
          ruff check python scripts demo/source
          PYTHONPATH=python python -m pytest python/tests -q

  loom:
    name: Loom interleaving model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Explore ordered frontier interleavings
        run: cargo test --locked -p reprocut-core --features loom --test loom_winner
        env:
          RUSTFLAGS: --cfg loom

  miri:
    name: Miri undefined-behavior model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install nightly Miri
        run: rustup toolchain install nightly --profile minimal --component miri
      - name: Prepare Miri sysroot
        run: cargo +nightly miri setup
      - name: Run pure core contracts under Miri
        run: >-
          cargo +nightly miri test --locked -p reprocut-core
          --lib
          --test model_contract
          --test oracle_contract
          --test reducer_contract

  sanitizer:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install nightly toolchain
        run: rustup toolchain install nightly --profile minimal
      - name: Test core, grammars, snapshots, and engine with ASan
        run: >-
          cargo +nightly test --locked
          -p reprocut-adapters
          -p reprocut-core
          -p reprocut-engine
          -p reprocut-runner
          -p reprocut-syntax
          -p reprocut-workspace
          --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: detect_leaks=1
          TEST_PYTHON: python3

  supply-chain:
    name: Advisories, licenses, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  oci-archive:
    name: Real OCI archive export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Select an OCI-capable Buildx driver
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          driver: docker-container
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Cache the network-disabled build base
        run: docker pull debian:bookworm-slim
      - name: Build and structurally validate an OCI archive
        run: cargo test --locked -p reprocut-oci --test oci_builder -- --ignored --nocapture

  oracle-adversarial:
    name: Adversarial failure-oracle contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Exercise automatic, regex, exit-zero, truncation, and collision cases
        run: >-
          cargo test --locked -p reprocut-core
          --test oracle_contract
          --test oracle_properties
          --test oracle_adversarial

  python-isolation:
    name: Frozen offline Python candidate isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Disable package indexes and run committed-wheel isolation contracts
        run: cargo test --locked -p reprocut-engine --test python_isolation_contract
        env:
          TEST_PYTHON: python
          PIP_NO_INDEX: "1"
          PIP_CONFIG_FILE: /dev/null

  snapshot-integrity:
    name: Immutable snapshot bytes and Unix execute masks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Prove mutation detection and executable-bit preservation
        run: cargo test --locked -p reprocut-workspace --test snapshot_integrity

  python-wheel:
    name: Native wheel / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build and install native wheel
        run: |
          python -m pip install maturin==1.14.1 pytest==8.4.2 \
            "tomli==2.4.1; python_version < '3.11'"
          maturin build --locked --release
          python -m pip install --force-reinstall target/wheels/reprocut-*.whl
      - name: Require native backend in Python contracts
        run: python -m pytest python/tests -q
        env:
          REPROCUT_REQUIRE_NATIVE: "1"

  cli-platforms:
    name: CLI smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Exercise the real CLI fixture
        run: cargo test --locked -p reprocut --test cli_contract
        env:
          TEST_PYTHON: python

  release-benchmark:
    name: 312-file release benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build the measured release binary
        run: cargo build --locked --release -p reprocut
      - name: Install the pinned process-tree sampler
        run: python -m pip install psutil==7.2.2
      - name: Measure five fresh reductions
        run: >-
          python scripts/benchmark_release.py
          --reprocut target/release/reprocut
          --python "$(command -v python)"
          --output output/release-benchmark
          --runs 5
          --warmup 1
      - name: Upload raw benchmark evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reprocut-release-benchmark
          path: output/release-benchmark
          if-no-files-found: error

  release-packages:
    name: crates.io and PyPI package artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Install pinned Python packaging tools
        run: python -m pip install maturin==1.14.1 twine==7.0.0
      - name: Package every publishable Rust crate
        run: |
          python scripts/release/publish_crates.py preflight --repository .
          mkdir -p dist/crates
          cp target/package/*.crate dist/crates/
      - name: Build ABI3 wheel and source distribution
        run: |
          maturin build --locked --release --out dist/wheels
          # `sdist` performs no dependency resolution, so maturin intentionally has no
          # `--locked` flag for this subcommand. Cargo.lock is included in the archive.
          maturin sdist --out dist/sdist
      - name: Validate Python package metadata and contents
        run: python -m twine check dist/wheels/* dist/sdist/*
      - name: Rebuild and smoke the sdist outside the repository
        run: |
          python -m pip wheel \
            --no-deps \
            --no-cache-dir \
            "dist/sdist/reprocut-0.1.0.tar.gz" \
            --wheel-dir /tmp/reprocut-sdist-wheel
          python -m venv /tmp/reprocut-sdist-smoke
          /tmp/reprocut-sdist-smoke/bin/python -m pip install \
            --no-deps \
            /tmp/reprocut-sdist-wheel/reprocut-*.whl
          /tmp/reprocut-sdist-smoke/bin/python -m pip install pytest==8.4.2
          REPROCUT_REQUIRE_NATIVE=1 \
            /tmp/reprocut-sdist-smoke/bin/python -m pytest python/tests -q
      - name: Upload registry-ready packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reprocut-release-packages
          path: dist
          if-no-files-found: error

  developer-surfaces:
    name: Editor, gallery, and static release audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.6.0"
      - name: Validate the protocol-only editor client
        run: node --test editors/vscode/test/*.test.js
      - name: Validate redacted gallery submissions without executing them
        run: node --test gallery/test/*.test.js
      - name: Build the static gallery
        run: node gallery/scripts/build.js
      - name: Require every static 0.1 release condition
        run: python scripts/release/audit.py --static-only
