name: Static gallery

on:
  pull_request:
    paths:
      - "gallery/**"
      - ".github/workflows/gallery.yml"
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - ".github/workflows/gallery.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate without executing submissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.6.0"
      - name: Run schema, path, size, license, and secret contracts
        run: node --test gallery/test/*.test.js
      - name: Build static HTML from redacted JSON only
        run: node gallery/scripts/build.js
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: gallery/dist

  deploy:
    name: Deploy reviewed main-branch gallery
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
