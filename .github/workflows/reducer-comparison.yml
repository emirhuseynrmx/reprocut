name: Reducer comparison

on:
  workflow_dispatch:
  push:
    paths:
      - scripts/benchmark/**
      - .github/workflows/reducer-comparison.yml

permissions:
  contents: read

jobs:
  head-to-head:
    name: cvise vs reprocut on one C file
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Install the field
        run: |
          sudo apt-get update
          sudo apt-get install -y bc default-jre-headless
          for package in cvise creduce; do
            sudo apt-get install -y "$package" || echo "$package is unavailable"
          done
          pipx install shrinkray || pip install --user shrinkray || echo "shrinkray is unavailable"
          sudo mkdir -p /opt/perses
          sudo curl -fsSL --retry 3 -o /opt/perses/perses_deploy.jar             https://github.com/uw-pluverse/perses/releases/download/v2.7/perses_deploy.jar             || echo "perses is unavailable"
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Build reprocut
        run: cargo build --release --locked -p reprocut --bin reprocut

      - name: Prepare the case
        run: bash scripts/benchmark/prepare.sh "${{ runner.temp }}/benchmark"

      - name: Run the arena
        run: python3 scripts/benchmark/arena.py "${{ runner.temp }}/benchmark"

      - name: Publish the table
        if: always()
        run: |
          {
            echo '## Reduction arena'
            echo
            echo '```'
            python3 scripts/benchmark/arena.py --render "${{ runner.temp }}/benchmark" || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: reducer-comparison
          path: ${{ runner.temp }}/benchmark
          retention-days: 14
