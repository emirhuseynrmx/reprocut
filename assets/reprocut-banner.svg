    <text x="82" y="378" font-size="53" font-weight="750" letter-spacing="-1.8" fill="#b39cff">Less project.</text>
    <text x="84" y="426" font-size="22" fill="#a7b0ce">Turn a failing repository into the smallest useful reproduction</text>
    <text x="84" y="458" font-size="22" fill="#a7b0ce">you can hand to another engineer — with evidence.</text>
    <text x="84" y="520" class="mono micro" fill="#d8d9ec">Diagnose</text>
    <text x="223" y="520" class="mono" font-size="20" fill="#7e88ad">→</text>
