<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="title desc">
  <title id="title">ReproCut — Same failure. Less project.</title>
  <desc id="desc">An evidence-bound ReproCut alpha banner showing a stable failure diagnosed, an eighteen-file project reduced to three files, and a strict three-of-three verification.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.52" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#160d2f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="0.52" stop-color="#7955ff"/>
      <stop offset="1" stop-color="#ff8b6b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b37" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#090d1d" stop-opacity="0.94"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
